<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book explore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <nav class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-xl font-bold text-sky-700">Book Explorer</a>
      <div class="flex items-center gap-4 text-sm font-medium sm:text-base">
        <a href="index.html" class="text-slate-600 hover:text-sky-700">Home</a>
        <a href="favorate.html" class="text-sky-700">Favorites</a>
        <a href="about.html" class="text-slate-600 hover:text-sky-700">About</a>
      </div>
    </div>
  </nav> 
   <header class="bg-cyan-600 py-14 text-white">
    <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold sm:text-4xl">Discover your next read</h1>
      <p class="mt-3 max-w-2xl text-sm text-sky-100 sm:text-base">Search books from Open Library and save your favorites.</p>
      <form id="search-form" class="mt-6 flex flex-col gap-3 sm:flex-row">
       </button>   <label for="search-input" class="sr-only">Search by title</label>
        <input
          id="search-input"
          type="text"
          placeholder="Search by title, e.g. Harry Potter"
          class="w-full rounded-lg border border-sky-200 px-4 py-3 text-slate-800 outline-none ring-sky-300 focus:ring sm:max-w-lg"
          required
        />
        <button
          type="submit"
          class="rounded-lg bg-slate-900 px-6 py-3 font-semibold text-white transition hover:bg-slate-800"
        >
          Search
      </form>
    </div>
    </header>
<main class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-6 flex items-center justify-between gap-3">
      <h2 class="text-2xl font-semibold">Books</h2>
      <p id="result-label" class="text-sm text-slate-600">Loading books...</p>
    </div>

    <div id="loading" class="mb-5 hidden rounded-lg border border-sky-200 bg-white p-4 text-sm text-slate-600">
      Loading books...
    </div>

    <div id="empty-state" class="mb-5 hidden rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
      No results found. Try another title.
    </div>

    <section id="books-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" aria-live="polite"></section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-4 text-center text-sm text-slate-500">
    Book Explorer Capstone - Responsive, Interactive, API Powered done by Ka
  </footer>

  <script type="module" src="home.js"></script>
</body>
</html>

</body>
</html>
